<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        HTML Form
    </h1>
    <form>
        <label for="Fname"> First Name:</label> 
        <input type="text"  name="fname" id="fname" placeholder="Your First Name">
        <label for="Lname"> Last Name:</label>
        <input type="text" name="lname" id="lname" placeholder="Your Last Name">
        <br>
        <p> Choose your Favourite Language:</p>
        <input type="radio" name="fav-language" id="HTML">
        <label for="HTML"> HTML</label>
        <input type="radio" name="fav-language" id="CSS">
        <label for="CSS"> CSS </label>
        <input type="radio" name="fav-language" id="JavaScript">
         <label for="JavaScript"> Javascript</label>
         <p> Choose your Interest</p>
         <input type="checkbox" name="Interest" id="Playing">
         <label for="Playing"> Playing</label>
         <input type="checkbox" name="Interest" id="Dancing">
         <label for="Dancing"> Dancing</label>
         <input type="checkbox" name="Interest" id="Singing">
         <label for="Singing"> Singing</label> <br><br>
         <label for="Password"> Password:</label>
         <input type="password" name="pwd" id="password"> <br><br>
         <label for="Describe Yourself"> Describe Yourself:</label> <br>
         <textarea name="yourself" id=" Describe Yourself" rows="2" cols="50"></textarea> <br><br>
         <input type="submit" Value="Submit">
        
    </form>
</body>
</html>
